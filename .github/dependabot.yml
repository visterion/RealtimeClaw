version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint 8.x (latest 8.71.0 as of 2026-09) declares peer
      # typescript ">=4.8.4 <6.1.0", so TypeScript 6.1+ / 7 breaks `npm ci`.
      # Drop this entry once a typescript-eslint release widens that range.
      - dependency-name: typescript
        versions: [">=6.1"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
